services:
  db:
    image: postgres:16-alpine
    container_name: autocare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autocare
      POSTGRES_PASSWORD: autocare_dev
      POSTGRES_DB: autocare
    ports:
      - "54329:5432"
    volumes:
      - autocare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocare -d autocare"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autocare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autocare_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autocare_pgdata:
  autocare_redisdata:
